workflows:
  default-workflow:
    name: Build Android and iOS (PickDuo Official)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - pickduo_keystore
      vars:
        CM_KEYSTORE_PASSWORD: "PickDuo2026"
        CM_KEY_PASSWORD: "PickDuo2026"
        CM_KEY_ALIAS: "upload"
    scripts:
      - name: Set up Android Code Signing File
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          
          echo "$CM_KEYSTORE" | base64 --decode > android/upload-keystore.jks
          
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build Android Release App Bundle
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          
          flutter clean
          flutter pub get
          flutter build appbundle --release --no-pub
      - name: Verify Android AAB
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          
          echo "=== AAB FILES ==="
          find build -type f -name "*.aab" -print
      - name: Build iOS App for Testing
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          flutter build ios --release --no-codesign
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/iphoneos/*.app