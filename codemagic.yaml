workflows:
  android-workflow:
    name: PickDuo Build Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - pickduo_keystore
      vars:
        CM_KEYSTORE_PASSWORD: "PickDuo2026"
        CM_KEY_PASSWORD: "PickDuo2026"
        CM_KEY_ALIAS: "upload"

    scripts:
      - name: Set up Android Code Signing File
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          echo "$CM_KEYSTORE" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Fetch Dependencies
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          flutter pub get

      - name: Diagnose and Build Android AAB
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi

          echo "===== FLUTTER ====="
          flutter --version

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          cd android
          ./gradlew --version

          echo "===== BUILD ====="
          set +e
          ./gradlew bundleRelease --stacktrace --info
          GRADLE_EXIT=$?

          cd ..

          echo "===== GRADLE EXIT CODE: $GRADLE_EXIT ====="
          echo "===== AAB FILES ====="
          find . -type f -name "*.aab" -print

          exit $GRADLE_EXIT

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

  ios-workflow:
    name: PickDuo Build iOS & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: vthypercasualgames

    environment:
      groups:
        - pickduo_apple_keystore
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vthypercasualgames.pickduo
      flutter: stable
      xcode: latest

    scripts:
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Fetch Dependencies
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          flutter pub get

      - name: Build Flutter IPA for iOS
        script: |
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then cd "$PROJECT_ROOT"; fi
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true